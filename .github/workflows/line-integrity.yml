name: Line integrity checks

on:
  pull_request:
    paths:
      - "src/line-groups.ts"
      - "src/consensus.ts"
      - "src/analyze.ts"
      - "src/partial-auto.ts"
      - "tests/line-text.test.ts"
      - "tests/reader-originals.test.ts"
      - "tests/partial-auto.test.ts"
      - ".github/workflows/line-integrity.yml"

permissions:
  contents: read

jobs:
  line-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Line integrity and partial quote regressions
        run: npx vitest run tests/line-text.test.ts tests/reader-originals.test.ts tests/partial-auto.test.ts
