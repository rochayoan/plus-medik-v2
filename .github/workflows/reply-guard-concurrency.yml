name: Reply-guard concurrency isolation

on:
  pull_request:
    paths:
      - ".github/workflows/reply-guard-concurrency.yml"
      - "src/text-pilot-gate.ts"
      - "tests/text-pilot-gate.test.ts"
      - "api/kapso/webhook.ts"
      - "supabase/migrations/*reply_guard*.sql"

permissions:
  contents: read

jobs:
  reply-guard-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Baseline concurrency (diagnostic only)
        continue-on-error: true
        run: for i in 1 2 3 4 5 6; do echo "Concurrency iteration $i"; npx vitest run tests/reply-guard-db.test.ts tests/reply-guard-e2e.test.ts -t "concurrencia:" --maxWorkers=1 --no-file-parallelism || exit 1; done
      - name: Reproduce with monotonic reservation timestamps (temporary CI workspace only)
        run: |
          sed -i 's/send_reserved_at = now(),/send_reserved_at = clock_timestamp(),/' supabase/migrations/20261025000000_plusmedik_turns.sql
          grep -q 'send_reserved_at = clock_timestamp(),' supabase/migrations/20261025000000_plusmedik_turns.sql
          for i in 1 2 3 4 5 6; do echo "Concurrency iteration $i"; npx vitest run tests/reply-guard-db.test.ts tests/reply-guard-e2e.test.ts -t "concurrencia:" --maxWorkers=1 --no-file-parallelism || exit 1; done
