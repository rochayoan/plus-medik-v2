name: Reply-guard concurrency isolation

on:
  pull_request:
    paths:
      - ".github/workflows/reply-guard-concurrency.yml"
      - "src/text-pilot-gate.ts"
      - "tests/text-pilot-gate.test.ts"
      - "api/kapso/webhook.ts"
      - "supabase/migrations/*reply_guard*.sql"

permissions:
  contents: read

jobs:
  reply-guard-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Reply-guard concurrency (isolated)
        run: npx vitest run tests/reply-guard-db.test.ts tests/reply-guard-e2e.test.ts --maxWorkers=1 --no-file-parallelism
