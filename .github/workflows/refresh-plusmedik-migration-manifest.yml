name: Refresh PlusMedik migration manifest (feature branch only)

on:
  push:
    branches:
      - feat/pilot-text-quote-safety-gate
    paths:
      - ".github/workflows/refresh-plusmedik-migration-manifest.yml"

permissions:
  contents: write

jobs:
  regenerate:
    if: github.repository == 'rochayoan/plus-medik-v2' && github.ref == 'refs/heads/feat/pilot-text-quote-safety-gate'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout trusted feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/pilot-text-quote-safety-gate
          persist-credentials: true
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install lockfile dependencies without scripts
        run: npm ci --ignore-scripts
      - name: Regenerate read-only preflight and postflight
        run: npx tsx scripts/migration-manifest.ts
      - name: Commit only generated SQL checks
        run: |
          git add supabase/preflight/v2_pre_apply_read_only.sql supabase/preflight/v2_post_apply_read_only.sql
          if git diff --cached --quiet; then
            echo "No changes to generated checks"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(db): regenerar preflight y postflight para migración 16"
          git push origin HEAD:refs/heads/feat/pilot-text-quote-safety-gate
